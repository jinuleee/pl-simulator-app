<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f3f2ee;--pn:#fff;--pn2:#faf9f6;--tx:#1d1d1b;--tx2:#6b6a64;--tx3:#9a988f;--bd:#e8e6df;--bd2:#d8d5cb;--ac:#1f5fbf;--acbg:#e8f0fc;--y:#fff6d6;--yb:#ecd98f;--sk:#e6f0fb;--skb:#b3d1f2;--pos:#2b7a1c;--posbg:#e6f4df;--neg:#b42318;--negbg:#fdeceb;--wn:#8a5a00;--wnbg:#fdf3dc}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--pn:#222220;--pn2:#2a2a27;--tx:#efeee9;--tx2:#b3b1a8;--tx3:#85837a;--bd:#38382f;--bd2:#4a4a40;--ac:#8db9f0;--acbg:#16385e;--y:#4a3f14;--yb:#8a7424;--sk:#14385c;--skb:#2f6aa3;--pos:#9bd06a;--posbg:#233a16;--neg:#f4a29a;--negbg:#47201c;--wn:#f0c66b;--wnbg:#3f3216}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;gap:2px;align-items:center;padding:0 20px;background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;min-height:52px;flex-wrap:wrap}
.top b{font-size:15px;font-weight:700;margin-right:24px;letter-spacing:-.2px;white-space:nowrap;flex-shrink:0}
.tab{border:0;background:none;padding:0 14px;height:52px;color:var(--tx2);border-bottom:2px solid transparent;font-weight:500}
.tab.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;padding:14px 20px 4px;flex-wrap:wrap}
.sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd2);background:var(--pn);border-radius:9px;padding:6px 14px;font-weight:500}
.btn:hover{background:var(--pn2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.lnk{border:0;background:none;color:var(--tx3);font-size:11.5px;padding:0 4px}
.lnk:hover{color:var(--ac);text-decoration:underline}
.mini{border:1px solid var(--bd2);background:var(--pn);border-radius:6px;padding:0 8px;font-size:11px;color:var(--tx2)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding:12px 20px 24px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}.left{position:static!important}}
.left{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:16px;position:sticky;top:64px}
.left .t{font-size:11px;letter-spacing:.3px;color:var(--tx3);font-weight:600;margin:14px 0 6px}
.left .t:first-child{margin-top:0}
.left>.in,.left>.in.y,.left>select.in.y,.left .row2 .in{width:100%;text-align:left}
.left .r .in.y,.left .r .in.tx{width:118px}.left .r select.in.y{width:118px;text-align:left}.left .r .in.tx{text-align:left}
@media(max-width:640px){.top{padding:0 12px}.top b{margin-right:8px;font-size:14px}.tab{padding:0 10px;white-space:nowrap}.top .sp{width:100%;justify-content:flex-end;padding:0 0 8px}.bar,.split,.page{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
.left .row2{display:flex;gap:6px}.left .row2 .in{flex:1}
.stat{background:var(--pn2);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:14px 0 8px}
.stat .k{font-size:11px;color:var(--tx3)}.stat .v{font-size:24px;font-weight:700;letter-spacing:-.5px}.stat .v small{font-size:12px;color:var(--tx3);font-weight:500;margin-left:2px}
.lt{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.lt .k{color:var(--tx3)}.lt .v{text-align:right;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.card{position:relative;background:var(--pn);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.card.base{border:2px solid var(--ac)}
.nmi{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--yb);background:transparent;color:var(--tx);font:inherit;font-size:15px;font-weight:700;padding:2px 0}
.nmi:focus{outline:0;border-bottom-color:var(--ac)}
.card select.in.sm{width:84px}
.nmi::placeholder{color:var(--tx);opacity:1}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--acbg);color:var(--ac);font-weight:600;white-space:nowrap}
.chip2{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.chip2.up{background:var(--posbg);color:var(--pos)}.chip2.dn{background:var(--negbg);color:var(--neg)}
.warn{margin:0 16px 10px;padding:6px 10px;border-radius:8px;background:var(--wnbg);color:var(--wn);font-size:11.5px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}.card>.kpi:first-of-type{padding-top:40px}
.kl{font-size:11px;color:var(--tx3)}.kv{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2}.kv small{font-size:12px;color:var(--tx3);font-weight:500;margin-left:2px}
.in.sky::placeholder{color:var(--tx2);opacity:1}
.cmpt th{vertical-align:top}.cmpt td small{margin-left:4px;font-size:11px}.cmpt .nmi{width:100%;min-width:120px;font-size:13px}.cmpt th div{text-align:left}
.cdel{position:absolute;top:10px;right:12px;z-index:1;border:1px solid var(--bd2);background:var(--pn);border-radius:8px;font-size:11px;color:var(--tx2);padding:2px 10px}
.cdel:hover:not(:disabled){color:var(--neg);border-color:var(--neg)}.cdel:disabled{opacity:.35;cursor:default}
.cmpt .cn{color:var(--tx3);font-size:11px;margin-right:6px}
.kv.neg,.neg{color:var(--neg)}.pos{color:var(--pos)}
.ks{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.ks span{font-size:11px;background:var(--pn2);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;color:var(--tx2)}
.sx{border-top:1px solid var(--bd)}
.sx>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:11px 16px;cursor:pointer;font-weight:600;font-size:12.5px}
.sx>summary::-webkit-details-marker{display:none}
.sx>summary span::before{content:"›";display:inline-block;width:14px;color:var(--tx3);transition:transform .15s}
.sx[open]>summary span::before{transform:rotate(90deg)}
.sx>summary b{font-weight:500;color:var(--tx2)}
.sx .bd{padding:0 16px 12px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;color:var(--tx2)}
.r>span{flex:1}.r .c{display:flex;align-items:center;gap:4px}
.in{height:28px;border:1px solid transparent;border-radius:8px;padding:0 9px;background:var(--y);color:var(--tx);font:inherit;min-width:0;text-align:right}
.in:hover{border-color:var(--yb)}.in:focus{outline:2px solid var(--ac);outline-offset:-1px}
.in.y{width:112px}.in.sky{background:var(--sk);width:84px}.in.sky:hover{border-color:var(--skb)}
.in.tx{width:140px;text-align:left}
select.in{text-align:left;padding:0 6px}select.in.y{width:132px}
select.in.plain{background:var(--pn2);border-color:var(--bd2)}
em{font-style:normal;color:var(--tx3);font-size:11px;width:14px}
.cp{background:var(--pn2);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0}
.cp .top2{display:flex;gap:6px;align-items:center}.cp .top2 .in{flex:1;width:auto}
.cp .l3{display:grid;grid-template-columns:1.3fr .9fr 1.1fr;gap:6px;margin-top:6px}
.cp .l3 label{display:flex;flex-direction:column;font-size:10.5px;color:var(--tx3);gap:2px}
.cp .l3 .f{display:flex;align-items:center;gap:3px}.cp .l3 .in{width:100%}
.cp .sub{text-align:right;font-size:11px;color:var(--tx3);margin-top:4px}
.ry{background:var(--pn2);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0}
.ry .l2{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:11px;color:var(--tx3)}
.ry .r .in.tx{width:150px;text-align:left}
.ry .rg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.ry .rk{font-size:11.5px;color:var(--tx2);white-space:nowrap}.ry .ru{font-size:12px;color:var(--tx2);margin-left:-1px}
.ry .in.y{width:56px}.ry select.in.y{width:118px}.ry .am{margin-left:auto;font-weight:600;color:var(--tx);font-size:12px}
.add{border:1px dashed var(--bd2);background:none;border-radius:8px;padding:4px 10px;color:var(--tx3);width:100%;margin-top:2px}
.add:hover{color:var(--ac);border-color:var(--ac)}
.note{font-size:11px;color:var(--tx3);margin:4px 0 6px}
.res{display:flex;justify-content:space-between;padding:3px 0;color:var(--tx2)}
.res b{font-weight:500;color:var(--tx)}
.res.k{border-top:1px solid var(--bd2);margin-top:4px;padding-top:6px}.res.k b,.res.k{color:var(--tx);font-weight:700}
.res b.neg{color:var(--neg)}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:16px}
.bt{font-weight:700;margin-bottom:8px;font-size:13px}
.bar2{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:3px 0}
.bar2 .tr{height:8px;background:var(--bd);border-radius:4px;position:relative}
.bar2 .tr i{position:absolute;top:0;bottom:0;border-radius:4px}

  if(!rem.none&&!force&&rem.sha!==c.sha){ghStatus('충돌: GitHub에 다른 저장본이 있음. 설정 탭에서 "불러오기" 또는 "덮어쓰기 저장" 선택');ghBusy=false;if(!quiet){ui.msg='GitHub에 다른 저장본이 있어 저장하지 않았습니다. 설정 탭에서 불러오기 또는 덮어쓰기 저장을 선택해 주세요.';render()}return}
  c.sha=await ghWrite(c,text,rem.none?null:rem.sha);c.hash=ghHash(text);ghPut(c);
  ghStatus('GitHub 저장됨 '+new Date().toTimeString().slice(0,5));
  if(!quiet){ui.msg='GitHub에 저장했습니다: '+esc(c.repo)+'/'+esc(c.path);render()}
 }catch(e){ghStatus('GitHub 저장 실패: '+e.message);if(!quiet){ui.msg='GitHub 저장 실패: '+esc(e.message);render()}}

// 불러오기: 현재 화면 내용을 GitHub 저장본으로 교체
async function ghPull(quiet){
 var c=ghCfg();if(!ghOn(c)||ghBusy)return;ghBusy=true;
 try{
  var rem=await ghRead(c);
  if(rem.none){ghStatus('GitHub에 저장본 없음 (저장하면 새로 만들어짐)');if(!quiet){ui.msg='GitHub에 아직 저장본이 없습니다. "지금 저장"을 눌러 주세요.';render()}ghBusy=false;return}
  var s=JSON.parse(rem.text);if(!(s&&s.sc&&s.sc.length))throw new Error('저장본 형식이 올바르지 않음');
  state=upgrade(s);c.sha=rem.sha;c.hash=ghHash(JSON.stringify(state));ghPut(c);persist();
  ghStatus('GitHub에서 불러옴 '+new Date().toTimeString().slice(0,5));
  if(!quiet)ui.msg='GitHub 저장본을 불러왔습니다.';render()
 }catch(e){ghStatus('GitHub 불러오기 실패: '+e.message);if(!quiet){ui.msg='GitHub 불러오기 실패: '+esc(e.message);render()}}
 ghBusy=false}

function ghAuto(){

 clearTimeout(ghTimer);ghTimer=setTimeout(function(){if(ghHash(JSON.stringify(state))!==c.hash)ghPush(false,true)},4000)}
// 앱을 열 때: 로컬이 마지막 동기화 이후 그대로면 GitHub 최신본으로 갱신, 로컬에 변경이 있고 GitHub도 바뀌었으면 알림만
async function ghStart(){
 var c=ghCfg();if(!c.auto||!ghOn(c))return;
 try{

  else{ui.msg='GitHub 저장본이 이 브라우저보다 새롭고, 이 브라우저에도 저장 안 된 변경이 있습니다. 설정 탭에서 불러오기 또는 덮어쓰기 저장을 선택해 주세요.';render()}

function chNorm(t){return String(t||'').replace(/\s+/g,'').toUpperCase()}
function chFind(name){var t=chNorm(name);if(!t)return null;for(var k=0;k<CHLOGOS.length;k++){var c=CHLOGOS[k];if(chNorm(c.n)===t)return c;for(var j=0;j<c.al.length;j++)if(chNorm(c.al[j])===t)return c}return null}
var CHSZ={chlg:[680,9,17],sm:[520,8,15],opt:[844,10,19.5]};   // [면적 기준, 최소 높이, 최대 높이] px
function chLogo(c,cls,sz){if(!(c&&c.src))return '';var z=CHSZ[sz||'chlg'],a=(c.w||160)/40,h=Math.max(z[1],Math.min(z[2],Math.sqrt(z[0]/a)));
 return '<img class="'+(cls||'chlg')+'" src="'+c.src+'" alt="'+esc(c.n)+'" style="height:'+h.toFixed(1)+'px">'}
function chPick(i,s,P){
 var c=chFind(s.chname),open=ui.chpick===i;
 var h='<div class="chp"><button class="chbtn'+(c&&c.src?' lg':'')+'" data-a="chopen" data-i="'+i+'" title="방송 채널 선택">'
  +(c?chLogo(c)+'<span class="chn">'+esc(c.n)+'</span>':'<span class="'+(s.chname?'':'ph')+'">'+(s.chname?esc(s.chname):'채널 선택')+'</span>')
  +'<i class="nocap">▾</i></button>';
 if(open){h+='<div class="chbg nocap"></div><div class="chpop nocap" role="dialog" aria-label="방송 채널 선택"><div class="chph"><b>방송 채널 선택</b><button class="chx" data-a="chopen" data-i="'+i+'" title="닫기">✕</button></div><div class="chgrid">';
  CHLOGOS.forEach(function(x){h+='<button class="chopt'+(c===x?' on':'')+'" data-a="chset" data-i="'+i+'" data-c="'+esc(x.n)+'">'+(x.src?chLogo(x,'chlg','opt'):'')+'<small>'+esc(x.n)+'</small></button>'});
  h+='</div><div class="choth"><span>목록에 없는 채널은 직접 입력</span>'+TX(P+'chname',s.chname,'예: 채널명')+'</div></div>'}
 return h+'</div>'}
var CHPH={'방송':'예: 채널 가','B2C':'예: 네이버 스마트스토어','직매입':'예: 대형마트 A','공구':'예: 공동구매 채널'};
function kpi(l,cm,r){var c=cm<0?' neg':'';return '<div class="kpi"><div><div class="kl">'+l+'</div><div class="kv'+c+'">'+fmt(cm)+'<small>원</small></div></div><div><div class="kl">CM%</div><div class="kv'+c+'">'+pc(r,1)+'</div></div></div>'}
function card(i,o,multi,bodyOnly){
 var s=state.sc[i],ch=state.ch,P='sc.'+i+'.',bc=ch==='방송',dm=ch==='직매입',b2=ch==='B2C',isb=i===state.base,K='c'+i+'_',e=eff(s),ST=state.ST,vd=vendorOf(ST,s),h,b;

 h+='</tbody></table></div><div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-a="test">예시 대조 검증 실행</button><button class="btn" data-a="resetst">설정을 초기값으로 복원</button></div>'+ghPanel()+'</div>';
 return h}

// ---------- 렌더 ----------
function render(keep){
 var a=document.activeElement,k=null;
 if(keep&&a&&a.dataset&&a.dataset.p)k={p:a.dataset.p,v:a.value,s:a.selectionStart};
 var os=compute(),w=ui.tab==='work',bt=ui.tab==='beta';
 var tabs=[['work','작업대'],['box','보관함'],['set','설정'],['beta','베타']];
 var h='<div class="top"><div class="brand"><b>P&amp;L Simulator</b><small id="ver">v'+APP_VERSION+' · 업데이트 '+APP_UPDATED+'</small></div><nav class="tabs">'+tabs.map(function(t){return '<button class="tab'+(ui.tab===t[0]?' on':'')+(t[0]==='beta'?' tbeta':'')+'" data-a="tab" data-t="'+t[0]+'" title="'+(t[0]==='beta'?'베타 (새 화면)':t[1])+'">'+svgI(t[0])+'<span>'+t[1]+'</span>'+(t[0]==='beta'?'<small>NEW</small>':'')+'</button>'}).join('')+'</nav>'
  +(bt?'<span class="sp">'+ib('addsc','add','안 추가')+ib('cap','cam','표 캡처',' data-id="capboard" data-n="결과비교"')+ib('cap','table','비교 캡처',' data-id="capcmp" data-n="구성가격비교"')+ib('kakao','msg','카톡 요약')+'</span>':'')
  +(w?'<span class="sp">'+ib('addsc','add','안 추가')+ib('cap','cam','표 캡처',' data-id="capcards" data-n="시뮬레이션표"')+ib('cap','table','비교 캡처',' data-id="capcmp" data-n="구성가격비교"')+ib('kakao','msg','카톡 요약')+'</span>':'')+'</div>';
 h+=w?work(os):bt?betaTab(os):ui.tab==='box'?boxTab():setTab();
 h+='<div class="lg"><span><i style="background:var(--y);border:1px solid var(--yb)"></i>직접 입력 ("예: ..."는 입력 안내)</span><span><i style="background:var(--sk);border:1px solid var(--skb)"></i>자동값 (비우면 자동, 입력하면 덮어씀)</span><span>글자만 있는 값은 자동 계산 결과</span><span style="margin-left:auto">v'+APP_VERSION+' · 자동 저장 (이 브라우저)</span></div>';
 document.getElementById('app').innerHTML=h;
 if(k){var e=document.querySelector('[data-p="'+k.p+'"]');if(e){e.focus();if(e.tagName!=='SELECT'&&e.type!=='checkbox'){e.value=k.v;try{e.setSelectionRange(k.s,k.s)}catch(x){}}}}
 persist()}
// 글자 입력칸은 화면을 다시 그리지 않고 이름 표시만 갱신 (한글 조합이 끊기지 않게)
function updateBinds(){
 document.querySelectorAll('input[data-nmph]').forEach(function(el){el.placeholder=nm(+el.dataset.nmph)});
 document.querySelectorAll('[data-bind]').forEach(function(el){var b=el.dataset.bind;
  if(b==='dirty')el.innerHTML=dirtyHtml();
  else if(b==='title')el.textContent=state.title||'상품명 미입력';
  else if(b.indexOf('nm')===0){var i=+b.slice(2);if(state.sc[i])el.textContent=nm(i)}
  else if(b.indexOf('cc')===0){var m=b.slice(2).split('_'),xx=state.sc[+m[0]],cc=xx&&xx.comps[+m[1]];if(cc)el.textContent=cc.n||('구성품 '+(+m[1]+1))}})}

function readVal(el){
 var t=el.dataset.t,v=el.value;
 if(t==='c')return el.checked?1:0;
 if(t==='n'||t==='p'){var raw=v.replace(/[,\s%]/g,'');
  if(raw==='')return el.dataset.nul?null:0;
  var val=parseFloat(raw);if(isNaN(val))return el.dataset.nul?null:0;
  return t==='p'?val/100:val}
 return v}
function isTextField(el){return el.dataset.t==='s'&&el.tagName!=='SELECT'}
var composing=false;
function liveFmt(el){                                          // 숫자칸: 입력하는 즉시 세 자리마다 쉼표 (커서 위치 유지)
 var v=el.value,pos=el.selectionStart,d=v.slice(0,pos).replace(/[^0-9]/g,'').length,neg=/^\s*-/.test(v),r=v.replace(/[^0-9.]/g,''),i=r.indexOf('.');
 if(r===''&&!neg)return;
 var ip=(i<0?r:r.slice(0,i)).replace(/\B(?=(\d{3})+(?!\d))/g,','),out=(neg?'-':'')+ip+(i<0?'':'.'+r.slice(i+1).replace(/\./g,''));
 el.value=out;var n=0,c=0;if(d>0)for(c=0;c<out.length;c++){if(/\d/.test(out[c])&&++n===d){c++;break}}
 try{el.setSelectionRange(c,c)}catch(x){}}
function onInput(e){
 var el=e.target,p=el.dataset&&el.dataset.p;
 if(el.dataset&&el.dataset.gh&&el.type!=='checkbox'){var gc=ghCfg();gc[el.dataset.gh]=el.value.trim();ghPut(gc);return}
 if(!p)return;
 if(el.tagName==='SELECT'||el.type==='checkbox')return;        // change 이벤트에서 처리
 if(isTextField(el)){setPath(state,p,el.value);updateBinds();persist();return}
 if(e.isComposing||composing)return;                           // 숫자칸에서 한글 조합 중이면 대기
 if(el.dataset.t==='n')liveFmt(el);
 setPath(state,p,readVal(el));render(true)}
var app=document.getElementById('app');
app.addEventListener('compositionstart',function(){composing=true});
app.addEventListener('compositionend',function(e){composing=false;var el=e.target;
 if(el.dataset&&el.dataset.p){setPath(state,el.dataset.p,readVal(el));if(isTextField(el)){updateBinds();persist()}else render(true)}});
app.addEventListener('input',onInput);
app.addEventListener('change',function(e){var el=e.target;
 if(el.dataset&&el.dataset.gh==='auto'){var ac=ghCfg();ac.auto=el.checked?1:0;ghPut(ac);ghAuto();return}
 if(el.id==='imp'){doImport(el);return}
 if(el.id==='vsel'){ui.vi=+el.value;render();return}
 if(el.id==='cpick'){if(el.value){var pp=el.value.split(':');copyFromSaved(+pp[0],+pp[1])}render();return}
 if(el.id==='ld'){if(el.value!==''){var x=state.saved[+el.value];openSaved(x);ui.msg='불러왔습니다: '+esc(x.name)}render();return}
 if(el.dataset&&el.dataset.p&&(el.tagName==='SELECT'||el.type==='checkbox')){setPath(state,el.dataset.p,readVal(el));render()}});

// 캡처용 복제본 보정: 접힌 섹션 내용 제거, 입력칸을 글자로 바꿔 세로 정렬이 깨지지 않게 함
function fixClone(doc,id){
 var root=doc.getElementById(id),src=document.getElementById(id),q='input,select,textarea',a=src.querySelectorAll(q),i;
 for(i=0;i<a.length;i++){                                      // 원본·복제본 짝은 data-cv 번호로 맞춤
  var o=a[i],c=root.querySelector('[data-cv="'+o.getAttribute('data-cv')+'"]'),sp=doc.createElement('span');
  if(!c)continue;
  if(o.type==='checkbox'){sp.textContent=o.checked?'☑':'☐'}
  else{
   var txt=o.tagName==='SELECT'?((o.options[o.selectedIndex]||{}).text||''):o.value;
   sp.className=c.className+' cv';sp.textContent=txt||(o.classList.contains('sky')||o.classList.contains('nmi')?o.placeholder:'');   // 하늘색 자동값은 보이고, 노랑 빈칸의 "예:" 안내는 캡처에서 뺌
   if(!txt&&!o.classList.contains('nmi'))sp.style.color='#9a988f';
   sp.style.width=o.offsetWidth+'px';
   sp.style.justifyContent=getComputedStyle(o).textAlign==='right'?'flex-end':'flex-start'}
  c.parentNode.replaceChild(sp,c)}
 if(id==='capcards'){                                          // 표(카드)만 딱 맞는 너비로: 오른쪽 빈 공간 제거
  var cs=src.querySelectorAll('.card'),g=root.querySelector('.grid');
  if(cs.length&&g){var w=cs[0].offsetWidth,cols=0,k;for(k=0;k<cs.length;k++)if(cs[k].offsetTop===cs[0].offsetTop)cols++;
   var tw=cols*w+(cols-1)*16;g.style.gridTemplateColumns='repeat('+cols+','+w+'px)';g.style.width=tw+'px';root.style.width=tw+'px'}}
 if(id==='capboard'){                                          // 베타 결과 카드: 제목 표시 + 카드 너비에 맞춤 (안 추가 카드 제외)
  var ks=src.querySelectorAll('.bxk:not(.bxadd)'),cap=root.querySelector('.bxcap');if(cap)cap.style.display='block';
  if(ks.length){var kw=ks[0].offsetWidth,kc=0,z;for(z=0;z<ks.length;z++)if(ks[z].offsetTop===ks[0].offsetTop)kc++;
   root.style.gridTemplateColumns='repeat('+kc+','+kw+'px)';root.style.width=(kc*kw+(kc-1)*14+48)+'px'}}
 [].forEach.call(root.querySelectorAll('details.sx:not([open]) > .bd'),function(n){n.parentNode.removeChild(n)})}   // 접힌 섹션은 내용 없이 제목만
function capture(id,name){
 var el=document.getElementById(id);
 if(!el||!el.textContent.trim()){ui.msg='캡처할 내용이 없습니다.';render();return}
 if(!window.html2canvas){ui.msg='캡처 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';render();return}
 [].forEach.call(el.querySelectorAll('input,select,textarea'),function(n,i){n.setAttribute('data-cv',i)});
 html2canvas(el,{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2,
  ignoreElements:function(n){return n.classList&&n.classList.contains('nocap')},onclone:function(doc){fixClone(doc,id)}}).then(function(cv){
  cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'_'+today()+'.png';a.click();
   try{navigator.clipboard.write([new ClipboardItem({'image/png':b})]).catch(function(){})}catch(x){}
   ui.msg='이미지로 저장했습니다: '+esc(a.download);render()})}).catch(function(err){ui.msg='캡처 실패: '+esc(err&&err.message||err);render()})}


// ---------- 보관함: 지금 열린 작업 (state.cur = 보관함 항목 id) 과 변경 여부 ----------
function newId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hsh(t){var h=0,i;for(i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h}
function markClean(){state.curH=hsh(JSON.stringify(snapshot()))}
function isDirty(){return state.curH!==hsh(JSON.stringify(snapshot()))}
function curItem(){if(!state.cur)return null;for(var k=0;k<state.saved.length;k++)if(state.saved[k].id===state.cur)return state.saved[k];return null}
function nowTs(){var d=new Date();return today()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function openSaved(x){if(!x.id)x.id=newId();applySnap(x.data);state.cur=x.id;markClean()}
function dirtyHtml(){var cx=curItem();if(!cx)return '';return isDirty()?'<i class="bxdirty">● 수정됨 (저장 안 됨)</i>':'<i class="bxclean">저장됨</i>'}
function snapshot(){return clone({cmt:state.cmt||'',ch:state.ch,title:state.title,memo:state.memo,base:state.base,info:state.info,sc:state.sc})}
function applySnap(d){state.cmt=d.cmt||'';state.ch=d.ch==='미리주문'?'B2C':d.ch;state.title=d.title;state.memo=d.memo||'';state.base=d.base||0;var ad=adopt({base:state.base,sc:d.sc,info:d.info});state.info=ad.info;state.sc=ad.sc;if(ui.tab!=='beta')ui.tab='work';ui.kakao='';ui.msg='';ui.bsel=state.base}

app.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');
 if(ui.chpick!=null&&!e.target.closest('.chpop,[data-a=chopen]')){ui.chpick=null;if(!b){render();return}}
 if(!b)return;
 var a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
 ui.msg='';if(a!=='bover')ui.ovw=0;
 if(a==='chopen'){ui.chpick=ui.chpick===i?null:i}
 else if(a==='chset'){state.sc[i].chname=b.dataset.c;ui.chpick=null}
 else if(a==='tab'){ui.tab=b.dataset.t;ui.kakao='';ui.chpick=null}
 else if(a==='addsc'){var cb=clone(state.sc[state.base]);cb.name='';cb.exc=0;state.sc.push(cb);ui.bsel=state.sc.length-1}
 else if(a==='bsel'){if(e.target.closest('input,select,button:not([data-a=bsel]),label'))return;if(ui.bsel===i)return;ui.bsel=i}
 else if(a==='bch'){state.ch=b.dataset.c}
 else if(a==='bdup'){var dp=clone(state.sc[i]);dp.name=dp.name?dp.name+' 사본':'';dp.exc=0;state.sc.splice(i+1,0,dp);ui.bsel=i+1}
 else if(a==='del'){if(state.sc.length>1){state.sc.splice(i,1);if(state.base===i)state.base=0;else if(state.base>i)state.base--;if(ui.bsel!=null&&ui.bsel>=i)ui.bsel=Math.max(0,ui.bsel-1)}}
 else if(a==='base'){state.base=i}
 else if(a==='inc'){state.sc[i].exc=state.sc[i].exc===1?0:1}
 else if(a==='addcomp'){state.sc[i].comps.push(newComp())}
 else if(a==='delcomp'){if(state.sc[i].comps.length>1)state.sc[i].comps.splice(j,1)}
 else if(a==='kakao'){ui.kakao=kakaoText(compute())}
 else if(a==='kclose'){ui.kakao=''}
 else if(a==='copy'){
  var cm=(state.cmt||'').trim(),full=document.getElementById('kt').value+(cm?'\n\n'+cm:''),ta=document.createElement('textarea'),ok=false;
  ta.value=full;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(x){}document.body.removeChild(ta);
  if(cm){state.cmtlog=state.cmtlog||[];var lg=state.cmtlog[state.cmtlog.length-1];                     // 코멘트 기록 (나중에 자주 쓰는 문구를 양식에 추가하는 용도)
   if(!lg||lg.text!==cm){state.cmtlog.push({ts:new Date().toISOString(),title:state.title,ch:state.ch,n:incl().length,text:cm});if(state.cmtlog.length>300)state.cmtlog.shift()}}
  ui.msg=ok?'복사했습니다.':'복사하지 못했습니다. 글자를 직접 선택해 복사해 주세요.'}
 else if(a==='cap'){capture(b.dataset.id,b.dataset.n);return}
 else if(a==='save'){var nmv=document.getElementById('sn').value.trim();if(!nmv){ui.msg='저장 이름을 입력해 주세요.'}else{var nid=newId();state.saved.unshift({id:nid,name:nmv,ts:nowTs(),data:snapshot()});state.cur=nid;markClean();ui.msg='저장했습니다: '+esc(nmv)}}
 else if(a==='bover'){ui.ovw=1}
 else if(a==='bcancel'){ui.ovw=0}
 else if(a==='bover2'){var cx=curItem(),on=(document.getElementById('sn')||{}).value;ui.ovw=0;
  if(cx){on=(on||'').trim();if(on)cx.name=on;cx.data=snapshot();cx.ts=nowTs();markClean();ui.msg='덮어써서 저장했습니다: '+esc(cx.name)}else ui.msg='열린 보관함 항목이 없습니다. 새로 저장해 주세요.'}
 else if(a==='load'){openSaved(state.saved[i]);ui.msg='불러왔습니다: '+esc(state.saved[i].name)}
 else if(a==='delsaved'){if(state.saved[i]&&state.saved[i].id&&state.saved[i].id===state.cur)state.cur=null;state.saved.splice(i,1)}
 else if(a==='export'){var bl=new Blob([JSON.stringify(state)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='손익시뮬레이터_백업_'+today()+'.json';l.click();ui.msg='내보냈습니다.'}
 else if(a==='import'){document.getElementById('imp').click();return}
 else if(a==='blank'){state.sc=[newSc()];state.info=newInfo();state.base=0;state.ch='방송';state.title='';state.memo='';if(ui.tab!=='beta')ui.tab='work';ui.bsel=0;state.cur=null}
 else if(a==='addv'){var vs=state.ST.vendors,cv=clone(vs[Math.min(ui.vi||0,vs.length-1)]);cv.id='v'+Date.now();cv.name=cv.name+' 복사';vs.push(cv);ui.vi=vs.length-1}
 else if(a==='delv'){var vl=state.ST.vendors;if(vl.length>1){vl.splice(ui.vi||0,1);ui.vi=0}}
 else if(a==='ghpush'){ghPush(false);return}
 else if(a==='ghforce'){ghPush(true);return}
 else if(a==='ghpull'){ghPull(false);return}
 else if(a==='resetst'){state.ST=clone(DEF_ST);ui.vi=0;ui.msg='설정과 물류사 견적을 초기값으로 되돌렸습니다.'}
 else if(a==='test'){var r=selfTest();ui.msg='예시 대조 (초기 설정 기준, 고정비 차감 전 CM)<br>'+r.map(function(x){return (x.ok?'일치 ':'불일치 ')+esc(x.name)+': 기대 '+x.exp+' / 계산 '+x.got.toFixed(2)}).join('<br>')}
 render()});
function doImport(inp){
 var f=inp.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var s=JSON.parse(r.result);
   if(s&&(s.ver===3||s.ver===4||s.ver===5)&&s.sc&&s.sc.length)state=upgrade(s);
   else throw 0;ui.msg='가져왔습니다.'}catch(x){ui.msg='이 파일은 P&amp;L Simulator 백업이 아닙니다.'}render()};
 r.readAsText(f)}
app.addEventListener('toggle',function(e){var k=e.target.dataset&&e.target.dataset.k;if(k)ui.open[k]=e.target.open},true);
render();
ghStart();
