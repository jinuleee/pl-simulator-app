<style>

.res{display:flex;justify-content:space-between;padding:3px 0;color:var(--tx2)}

.res.k{border-top:1px solid var(--bd2);margin-top:4px;padding-top:6px}.res.k b,.res.k{color:var(--tx);font-weight:700}
.res b.neg{color:var(--neg)}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:16px}
.bt{font-weight:700;margin-bottom:8px;font-size:13px}
.bar2{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:3px 0}

.bar2 .tr i.p{background:var(--pos);left:50%}.bar2 .tr i.n{background:var(--neg);right:50%}
.bar2 b{text-align:right;font-weight:600}
.pop{margin:12px 20px 0;padding:12px 14px;border:1px solid var(--ac);border-radius:14px;background:var(--acbg)}
.pop textarea{width:100%;height:150px;border:1px solid var(--bd2);border-radius:10px;background:var(--pn);color:var(--tx);font:inherit;padding:8px}
.capt{margin-bottom:12px}.capt b{font-size:18px;font-weight:700}.capt span{color:var(--tx2);margin-left:6px}
.lg{display:flex;gap:16px;padding:12px 20px;font-size:11px;color:var(--tx2);flex-wrap:wrap;border-top:1px solid var(--bd)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;font-weight:400;vertical-align:middle;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{color:var(--tx3);font-size:11px;font-weight:600}
.sc{overflow-x:auto}
.page{padding:16px 20px}
.page .in.y{width:72px}
textarea.in{width:100%;text-align:left;padding:8px;height:86px;resize:vertical}
.f2{display:flex;justify-content:space-between;align-items:center;max-width:420px;padding:4px 0;color:var(--tx2)}
.f2 .in.y{width:112px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1;min-width:44px}
.tab .e,.ib .e{font-size:20px}
.ib{border:1px solid var(--bd2);background:var(--pn);border-radius:10px;min-width:40px;height:36px;justify-content:center;padding:0 8px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ib:hover{background:var(--pn2)}.ib .l{color:var(--tx2)}
.cinc{position:absolute;top:10px;left:14px;z-index:1;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:4px;cursor:pointer}
.cv{display:inline-flex;align-items:center;white-space:nowrap;overflow:hidden;box-sizing:border-box;height:28px}
.nmi.cv{display:flex;height:auto;min-height:22px}
</style>

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/*ENGINE_START*/
// 손익 계산 엔진 (화면과 분리. test_engine.js가 이 구간만 꺼내 예시 값과 대조)
var ROY_BASES=['판매가(VAT포함)','매출(VAT제외)','공급가','원가합계','구성품1원가'];
var CH_KEYS=['방송','B2C','직매입','공구'];
var CH_NAME={'방송':'홈쇼핑 방송','B2C':'B2C(+미리주문)','직매입':'직매입','공구':'공구'};
var BTYPES=['라이브','데이터'];          // 라이브: 매 회차 고정비 포함 / 데이터: 2회차부터 고정비 제외
var TEMPS=['냉동','상온'];               // 품온 (냉장은 취급 안 함)
// 포장 항목: [저장 슬롯 번호, 이름]. 슬롯 번호는 저장 데이터와 호환되도록 고정이고, 품온마다 쓰는 항목만 보임
var PACK={'냉동':[[0,'작업료'],[1,'아이스박스'],[4,'포장재'],[5,'아이스팩'],[6,'보냉비닐'],[7,'드라이아이스'],[8,'OPP테이프']],
 '상온':[[0,'작업료'],[2,'선물박스'],[3,'카톤박스'],[4,'포장재(레토르트 등)'],[8,'OPP테이프']]};
var PLT_ITEMS=[['recv','입고 (파렛트당)'],['send','출고 (파렛트당)'],['pick','피킹·전표발행 (파렛트당)'],['piece','개별 피킹 (박스당)'],['sticker','스티커 부착 (박스당)'],['trunk','운송비 (차량 1회당)'],['load','상하차 (차량 1회당)']];
var LMODES=[['rate','비율 (공급가 기준)'],['plt','직납 상세 (파렛트)']];
// 물류사 견적 기본값 (물류사 가). 현재는 예시 블록에서 가져온 임시값 - 실제 견적을 받으면 설정 탭에서 교체
var DEF_ST={vat:1.1,conv:0.85,dmlog:0.08,dmlog2:0.06,vendors:[{id:'pj',name:'물류사 가',ship:2400,stor:0.012,
 pack:{'냉동':[[1000,1],[850,1],[0,0],[0,0],[0,0],[100,2],[100,1],[600,1],[50,0]],
       '상온':[[1000,1],[0,0],[0,0],[1000,1],[0,0],[0,0],[0,0],[0,0],[50,0]]},
 plt:{recv:3000,send:3000,pick:3000,piece:250,sticker:80,trunk:300000,load:30000},
 note:'임시값'}]};
function num(x){x=parseFloat(x);return isNaN(x)?0:x}
function isNil(v){return v===null||v===undefined||v===''}
function newComp(){return {n:'',p:null,q:null,w:null}}   // 이름, 단가(견적), 수량, 내용량(g, 1개당). 비워 두면 placeholder(예: ...)가 보임
function newSc(){return {name:'',btype:'라이브',chname:'',price:null,commrate:null,target:null,tax:'과세',temp:'냉동',
 comps:[newComp()],markup:null,ars:null,petc:null,adrate:null,
 roy:[{n:'',b:'',x:1,r:null},{n:'',b:'',x:1,r:null},{n:'',b:'',x:1,r:null}],
 fix:{vcr:null,gma:null,cook:null,mat:null,panel:null,fetc:null},
 vendor:'',shipp:null,shipq:null,iov:{},ston:0,
 lmode:'rate',lrate:null,prom:null,lrate2:null,bq:null,bp:null,trk:null,dmfix:null,exc:0}}
function vendorOf(ST,s){var L=ST.vendors||[],i;for(i=0;i<L.length;i++)if(L[i].id===s.vendor)return L[i];return L[0]||null}
function calcSc(s,ch,ST){
 var o={},bc=ch==='방송',dm=ch==='직매입',k;
 o.conv=bc?ST.conv:1;                                  // 전환율은 방송만 85% 고정
 o.baseqty=bc?num(s.target)*o.conv:(dm?num(s.target):1);
 o.cost=0;o.weight=0;
 s.comps.forEach(function(c){var q=num(c.q);o.cost+=num(c.p)*q;o.weight+=num(c.w)*q});
 o.cost*=1+num(s.markup);                              // 원가 가산율 (유통 단계 마진 등, 예: 5.3%)
 o.tax=s.tax||'과세';o.temp=s.temp||'냉동';
 o.price=num(s.price);
 o.sales=o.tax==='과세'?o.price/ST.vat:o.price;
 o.comm=o.sales*num(s.commrate);                       // 직매입은 채널 마진율
 o.supply=o.sales-o.comm;
 o.ad=ch==='B2C'?o.sales*num(s.adrate):0;
 var c1=s.comps.length?num(s.comps[0].p)*num(s.comps[0].q):0;
 o.ra=s.roy.map(function(r){
  var idx=ROY_BASES.indexOf(r.b);if(idx<0)return 0;
  var b=[o.price,o.sales,o.supply,o.cost,c1][idx];
  return b*num(r.x)*num(r.r)});
 o.sga1=num(s.ars)+num(s.petc)+o.ad+o.ra[0]+o.ra[1]+o.ra[2];
 o.fixtot=0;if(bc)for(k in s.fix)o.fixtot+=num(s.fix[k]);
 o.fixset=o.baseqty>0?o.fixtot/o.baseqty:0;
 var vd=vendorOf(ST,s);o.vname=vd?vd.name:'';
 o.items=[];o.packFound=false;
 if(dm){                                               // 직매입: 비율(공급가 x 물류비율) 또는 직납 상세(운송+파렛트+박스)
  var pl=(vd&&vd.plt)||{},tq=num(s.target),bq=num(s.bq),bp=num(s.bp),trk=isNil(s.trk)?1:num(s.trk);
  o.lrate=isNil(s.lrate)?ST.dmlog:num(s.lrate);
  o.pallets=bq>0&&bp>0?tq/(bq*bp):0;o.boxes=bq>0?tq/bq:0;   // shortcut: 파렛트 수는 소수 그대로 (엑셀 뇨끼 표와 동일), 올림이 필요하면 여기서 Math.ceil
  o.pltTotal=trk*(num(pl.trunk)+num(pl.load))+o.pallets*(num(pl.recv)+num(pl.send)+num(pl.pick))+o.boxes*(num(pl.piece)+num(pl.sticker))+num(s.dmfix);
  o.logi=s.lmode==='plt'?(tq>0?o.pltTotal/tq:0):o.supply*o.lrate;
 }else{                                                // 택배형: 물류사 견적(택배 + 품온별 포장 항목 + 보관료)
  var pr=vd&&vd.pack[o.temp];o.packFound=!!pr;
  o.items=(PACK[o.temp]||[]).map(function(it){var j=it[0],a=pr?pr[j]:[0,0],ov=(s.iov&&s.iov[j])||{};
   return {k:j,label:it[1],pa:num(a[0]),qa:num(a[1]),p:isNil(ov.p)?num(a[0]):num(ov.p),q:isNil(ov.q)?num(a[1]):num(ov.q)}});
  o.shipp=isNil(s.shipp)?(vd?num(vd.ship):0):num(s.shipp);
  o.shipqA=bc?0:1;o.shipq=isNil(s.shipq)?o.shipqA:num(s.shipq);
  o.stor=o.sales*(vd?num(vd.stor):0)*(s.ston?1:0);
  o.logi=o.shipp*o.shipq+o.stor;
  o.items.forEach(function(t){o.logi+=t.p*t.q})}
 o.sga=o.sga1+o.fixset+o.logi;
 o.cmpre=o.supply-o.cost-o.sga1-o.logi;                // 고정비 차감 전 CM (엑셀 대조용)
 o.cm=o.supply-o.cost-o.sga;
 o.cmb=dm?o.supply:o.sales;                            // CM% 분모: 직매입은 공급가, 그 외는 VAT 제외 매출
 o.cmr=o.cmb?o.cm/o.cmb:0;
 o.rep=bc&&s.btype==='데이터';                          // 데이터(녹화): 2회차부터 방송 고정비 제외

// ---------- 설정 탭 (고정값 + 물류사 견적) ----------
function setTab(){
 var ST=state.ST,vi=Math.min(ui.vi||0,ST.vendors.length-1),vd=ST.vendors[vi],V='ST.vendors.'+vi+'.',h;
 h='<div class="page">'+(ui.msg?'<div class="pop" style="margin:0 0 10px">'+ui.msg+'</div>':'')+'<div class="bt">고정값</div>'
  +'<div class="f2"><span>VAT 나눔값 (과세)</span>'+N('ST.vat',ST.vat)+'</div>'
  +'<div class="f2"><span>방송 전환율 (고정)</span><b>'+pc(ST.conv,0)+'</b></div>'
  +'<div class="f2"><span>직매입 물류비율 (공급가 대비)</span><span>'+N('ST.dmlog',ST.dmlog,'p','%')+'</span></div>'
  +'<div class="f2"><span>직매입 행사 물류비율</span><span>'+N('ST.dmlog2',ST.dmlog2,'p','%')+'</span></div>'
  +'<div class="bt" style="margin-top:16px">물류사 견적 <span class="tag" style="background:var(--wnbg);color:var(--wn)">임시값 - 실제 견적 받으면 교체</span></div>'
  +'<div class="note">물류사를 추가해 견적을 입력해 두면, 작업대 카드의 "물류사" 드롭다운에서 고른 견적대로 물류비가 계산됩니다.</div>'
  +'<div class="row2" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px"><select class="in plain" id="vsel" style="width:200px">'+ST.vendors.map(function(v,k){return '<option value="'+k+'"'+(k===vi?' selected':'')+'>'+esc(v.name)+'</option>'}).join('')+'</select>'
  +'<button class="btn sm" data-a="addv">+ 물류사 추가 (현재 견적 복사)</button><button class="btn sm" data-a="delv"'+(ST.vendors.length>1?'':' disabled')+'>이 물류사 삭제</button></div>'
  +'<div class="f2"><span>물류사 이름</span>'+TX(V+'name',vd.name,'예: OO물류')+'</div>'
  +'<div class="f2"><span>택배비 단가</span><span>'+N(V+'ship',vd.ship,'n','원')+'</span></div>'
  +'<div class="f2"><span>보관료율 (세트 매출 대비)</span><span>'+N(V+'stor',vd.stor,'p','%')+'</span></div>'
  +'<div class="f2"><span>비고</span>'+TX(V+'note',vd.note,'출처·견적일')+'</div>'
  +'<div class="bt" style="margin-top:14px">포장 자재 견적 (품온별)</div><div class="sc"><table><thead><tr><th>품온</th><th>항목</th><th>단가 (원)</th><th>수량</th></tr></thead><tbody>';
 TEMPS.forEach(function(t){PACK[t].forEach(function(it,k){var Q=V+'pack.'+t+'.'+it[0]+'.';
  h+='<tr><td>'+(k?'':'<b>'+t+'</b>')+'</td><td>'+it[1]+'</td><td>'+N(Q+'0',vd.pack[t]?vd.pack[t][it[0]][0]:0)+'</td><td>'+N(Q+'1',vd.pack[t]?vd.pack[t][it[0]][1]:0)+'</td></tr>'})});
 h+='</tbody></table></div>'
  +'<div class="bt" style="margin-top:14px">직납(직매입 상세) 단가</div><div class="sc"><table><thead><tr><th>항목</th><th>단가 (원)</th></tr></thead><tbody>';
 PLT_ITEMS.forEach(function(it){h+='<tr><td>'+it[1]+'</td><td>'+N(V+'plt.'+it[0],(vd.plt||{})[it[0]])+'</td></tr>'});
 h+='</tbody></table></div><div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-a="test">예시 대조 검증 실행</button><button class="btn" data-a="resetst">설정을 초기값으로 복원</button></div></div>';
 return h}

// ---------- 렌더 ----------
function render(keep){
 var a=document.activeElement,k=null;
 if(keep&&a&&a.dataset&&a.dataset.p)k={p:a.dataset.p,v:a.value,s:a.selectionStart};
 var os=compute(),w=ui.tab==='work',two=incl().length>1;
 var tabs=[['work','🧮','작업대'],['box','🗄️','보관함'],['set','⚙️','설정']];
 var h='<div class="top"><b>손익 시뮬레이터</b>'+tabs.map(function(t){return '<button class="tab'+(ui.tab===t[0]?' on':'')+'" data-a="tab" data-t="'+t[0]+'" title="'+t[2]+'"><span class="e">'+t[1]+'</span></button>'}).join('')
  +(w?'<span class="sp">'+ib('addsc','➕','안 추가')+ib('cap','📷','표 캡처',' data-id="capcards" data-n="시뮬레이션표"')+ib('cap','📊','구성비교',' data-id="capcmp" data-n="구성가격비교"')+ib('cap','⚖️','기준대비',' data-id="capvs" data-n="기준안대비"'+(two?'':' data-none="1"'))+ib('kakao','💬','카톡 요약')+'</span>':'')+'</div>';
 h+=w?work(os):ui.tab==='box'?boxTab():setTab();
 h+='<div class="lg"><span><i style="background:var(--y);border:1px solid var(--yb)"></i>직접 입력 ("예: ..."는 입력 안내)</span><span><i style="background:var(--sk);border:1px solid var(--skb)"></i>자동값 (비우면 자동, 입력하면 덮어씀)</span><span>글자만 있는 값은 자동 계산 결과</span><span style="margin-left:auto">v0.13 · 자동 저장 (이 브라우저)</span></div>';
 document.getElementById('app').innerHTML=h;
 if(k){var e=document.querySelector('[data-p="'+k.p+'"]');if(e){e.focus();if(e.tagName!=='SELECT'&&e.type!=='checkbox'){e.value=k.v;try{e.setSelectionRange(k.s,k.s)}catch(x){}}}}
 persist()}
// 글자 입력칸은 화면을 다시 그리지 않고 이름 표시만 갱신 (한글 조합이 끊기지 않게)
function updateBinds(){
 document.querySelectorAll('[data-bind]').forEach(function(el){var b=el.dataset.bind;
  if(b==='title')el.textContent=state.title||'상품명 미입력';
  else if(b.indexOf('nm')===0){var i=+b.slice(2);if(state.sc[i])el.textContent=nm(i)}
  else if(b.indexOf('cc')===0){var m=b.slice(2).split('_'),xx=state.sc[+m[0]],cc=xx&&xx.comps[+m[1]];if(cc)el.textContent=cc.n||('구성품 '+(+m[1]+1))}})}

function readVal(el){
 var t=el.dataset.t,v=el.value;
 if(t==='c')return el.checked?1:0;
 if(t==='n'||t==='p'){var raw=v.replace(/[,\s%]/g,'');
  if(raw==='')return el.dataset.nul?null:0;
  var val=parseFloat(raw);if(isNaN(val))return el.dataset.nul?null:0;
  return t==='p'?val/100:val}
 return v}
function isTextField(el){return el.dataset.t==='s'&&el.tagName!=='SELECT'}
var composing=false;
function onInput(e){
 var el=e.target,p=el.dataset&&el.dataset.p;if(!p)return;
 if(el.tagName==='SELECT'||el.type==='checkbox')return;        // change 이벤트에서 처리
 if(isTextField(el)){setPath(state,p,el.value);updateBinds();persist();return}
 if(e.isComposing||composing)return;                           // 숫자칸에서 한글 조합 중이면 대기
 setPath(state,p,readVal(el));render(true)}
var app=document.getElementById('app');
app.addEventListener('compositionstart',function(){composing=true});
app.addEventListener('compositionend',function(e){composing=false;var el=e.target;
 if(el.dataset&&el.dataset.p){setPath(state,el.dataset.p,readVal(el));if(isTextField(el)){updateBinds();persist()}else render(true)}});
app.addEventListener('input',onInput);
app.addEventListener('change',function(e){var el=e.target;
 if(el.id==='imp'){doImport(el);return}
 if(el.id==='vsel'){ui.vi=+el.value;render();return}
 if(el.id==='cpick'){if(el.value){var pp=el.value.split(':');copyFromSaved(+pp[0],+pp[1])}render();return}
 if(el.id==='ld'){if(el.value!==''){var x=state.saved[+el.value];applySnap(x.data);ui.msg='불러왔습니다: '+esc(x.name)}render();return}
 if(el.dataset&&el.dataset.p&&(el.tagName==='SELECT'||el.type==='checkbox')){setPath(state,el.dataset.p,readVal(el));render()}});

// 캡처용 복제본 보정: 접힌 섹션 내용 제거, 입력칸을 글자로 바꿔 세로 정렬이 깨지지 않게 함
function fixClone(doc,id){
 var root=doc.getElementById(id),src=document.getElementById(id),q='input,select,textarea',a=src.querySelectorAll(q),i;
 for(i=0;i<a.length;i++){                                      // 원본·복제본 짝은 data-cv 번호로 맞춤
  var o=a[i],c=root.querySelector('[data-cv="'+o.getAttribute('data-cv')+'"]'),sp=doc.createElement('span');
  if(!c)continue;
  if(o.type==='checkbox'){sp.textContent=o.checked?'☑':'☐'}
  else{
   var txt=o.tagName==='SELECT'?((o.options[o.selectedIndex]||{}).text||''):o.value;
   sp.className=c.className+' cv';sp.textContent=txt||(o.classList.contains('sky')?o.placeholder:'');   // 하늘색 자동값은 보이고, 노랑 빈칸의 "예:" 안내는 캡처에서 뺌
   if(!txt)sp.style.color='#9a988f';
   sp.style.width=o.offsetWidth+'px';
   sp.style.justifyContent=getComputedStyle(o).textAlign==='right'?'flex-end':'flex-start'}
  c.parentNode.replaceChild(sp,c)}
 [].forEach.call(root.querySelectorAll('details.sx:not([open]) > .bd'),function(n){n.parentNode.removeChild(n)})}   // 접힌 섹션은 내용 없이 제목만
function capture(id,name){
 var el=document.getElementById(id);
 if(!el||!el.textContent.trim()){ui.msg='캡처할 내용이 없습니다. 안을 2개 이상 비교에 포함해 주세요.';render();return}
 if(!window.html2canvas){ui.msg='캡처 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';render();return}
 [].forEach.call(el.querySelectorAll('input,select,textarea'),function(n,i){n.setAttribute('data-cv',i)});
 html2canvas(el,{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2,
  ignoreElements:function(n){return n.classList&&n.classList.contains('nocap')},onclone:function(doc){fixClone(doc,id)}}).then(function(cv){
  cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'_'+today()+'.png';a.click();
   try{navigator.clipboard.write([new ClipboardItem({'image/png':b})]).catch(function(){})}catch(x){}
   ui.msg='이미지로 저장했습니다: '+esc(a.download);render()})}).catch(function(err){ui.msg='캡처 실패: '+esc(err&&err.message||err);render()})}

function snapshot(){return clone({ch:state.ch,title:state.title,memo:state.memo,base:state.base,info:state.info,sc:state.sc})}
function applySnap(d){state.ch=d.ch==='미리주문'?'B2C':d.ch;state.title=d.title;state.memo=d.memo||'';state.base=d.base||0;var ad=adopt({base:state.base,sc:d.sc,info:d.info});state.info=ad.info;state.sc=ad.sc;ui.tab='work';ui.kakao='';ui.msg=''}

app.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;
 var a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
 ui.msg='';
 if(a==='tab'){ui.tab=b.dataset.t;ui.kakao=''}
 else if(a==='addsc'){var cb=clone(state.sc[state.base]);cb.name='';cb.exc=0;state.sc.push(cb)}
 else if(a==='del'){if(state.sc.length>1){state.sc.splice(i,1);if(state.base===i)state.base=0;else if(state.base>i)state.base--}}
 else if(a==='base'){state.base=i}
 else if(a==='inc'){state.sc[i].exc=state.sc[i].exc===1?0:1}
 else if(a==='addcomp'){state.sc[i].comps.push(newComp())}
 else if(a==='delcomp'){if(state.sc[i].comps.length>1)state.sc[i].comps.splice(j,1)}
 else if(a==='kakao'){ui.kakao=kakaoText(compute())}
 else if(a==='kclose'){ui.kakao=''}
 else if(a==='copy'){var t=document.getElementById('kt');t.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}ui.msg=ok?'복사했습니다.':'복사하지 못했습니다. 글자를 직접 선택해 복사해 주세요.'}
 else if(a==='cap'){if(b.dataset.none){ui.msg='기준 대비는 안이 2개 이상일 때 나옵니다. "안 추가"로 비교할 안을 만들어 주세요.';render();return}capture(b.dataset.id,b.dataset.n);return}
 else if(a==='save'){var nmv=document.getElementById('sn').value.trim();if(!nmv){ui.msg='저장 이름을 입력해 주세요.'}else{state.saved.unshift({name:nmv,ts:today(),data:snapshot()});ui.msg='저장했습니다: '+esc(nmv)}}
 else if(a==='load'){applySnap(state.saved[i].data);ui.msg='불러왔습니다: '+esc(state.saved[i].name)}
 else if(a==='delsaved'){state.saved.splice(i,1)}
 else if(a==='export'){var bl=new Blob([JSON.stringify(state)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='손익시뮬레이터_백업_'+today()+'.json';l.click();ui.msg='내보냈습니다.'}
 else if(a==='import'){document.getElementById('imp').click();return}
 else if(a==='blank'){state.sc=[newSc()];state.info=newInfo();state.base=0;state.ch='방송';state.title='';state.memo='';ui.tab='work'}
 else if(a==='addv'){var vs=state.ST.vendors,cv=clone(vs[Math.min(ui.vi||0,vs.length-1)]);cv.id='v'+Date.now();cv.name=cv.name+' 복사';vs.push(cv);ui.vi=vs.length-1}
 else if(a==='delv'){var vl=state.ST.vendors;if(vl.length>1){vl.splice(ui.vi||0,1);ui.vi=0}}
 else if(a==='resetst'){state.ST=clone(DEF_ST);ui.vi=0;ui.msg='설정과 물류사 견적을 초기값으로 되돌렸습니다.'}
 else if(a==='test'){var r=selfTest();ui.msg='예시 대조 (초기 설정 기준, 고정비 차감 전 CM)<br>'+r.map(function(x){return (x.ok?'일치 ':'불일치 ')+esc(x.name)+': 기대 '+x.exp+' / 계산 '+x.got.toFixed(2)}).join('<br>')}
 render()});
function doImport(inp){
 var f=inp.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var s=JSON.parse(r.result);
   if(s&&(s.ver===3||s.ver===4||s.ver===5)&&s.sc&&s.sc.length)state=upgrade(s);
   else throw 0;ui.msg='가져왔습니다.'}catch(x){ui.msg='이 파일은 손익 시뮬레이터 백업이 아닙니다.'}render()};
 r.readAsText(f)}
app.addEventListener('toggle',function(e){var k=e.target.dataset&&e.target.dataset.k;if(k)ui.open[k]=e.target.open},true);
render();
</script>
</body>
