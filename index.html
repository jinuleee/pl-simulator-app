<html lang="ko">
<head>

<!-- 실행: 이 파일을 더블클릭(크롬/엣지). 저장은 이 브라우저(localStorage)에만 됩니다. 계산 엔진: ENGINE_START ~ ENGINE_END -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f3f2ee;--pn:#fff;--pn2:#faf9f6;--tx:#1d1d1b;--tx2:#6b6a64;--tx3:#9a988f;--bd:#e8e6df;--bd2:#d8d5cb;--ac:#1f5fbf;--acbg:#e8f0fc;--y:#fff6d6;--yb:#ecd98f;--sk:#e6f0fb;--skb:#b3d1f2;--pos:#2b7a1c;--posbg:#e6f4df;--neg:#b42318;--negbg:#fdeceb;--wn:#8a5a00;--wnbg:#fdf3dc}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--pn:#222220;--pn2:#2a2a27;--tx:#efeee9;--tx2:#b3b1a8;--tx3:#85837a;--bd:#38382f;--bd2:#4a4a40;--ac:#8db9f0;--acbg:#16385e;--y:#4a3f14;--yb:#8a7424;--sk:#14385c;--skb:#2f6aa3;--pos:#9bd06a;--posbg:#233a16;--neg:#f4a29a;--negbg:#47201c;--wn:#f0c66b;--wnbg:#3f3216}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;gap:2px;align-items:center;padding:0 20px;background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;min-height:52px;flex-wrap:wrap}
.top b{font-size:15px;font-weight:700;margin-right:24px;letter-spacing:-.2px}
.tab{border:0;background:none;padding:0 14px;height:52px;color:var(--tx2);border-bottom:2px solid transparent;font-weight:500}
.tab.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;padding:14px 20px 4px;flex-wrap:wrap}
.sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd2);background:var(--pn);border-radius:9px;padding:6px 14px;font-weight:500}
.btn:hover{background:var(--pn2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.lnk{border:0;background:none;color:var(--tx3);font-size:11.5px;padding:0 4px}
.lnk:hover{color:var(--ac);text-decoration:underline}
.mini{border:1px solid var(--bd2);background:var(--pn);border-radius:6px;padding:0 8px;font-size:11px;color:var(--tx2)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding:12px 20px 24px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}.left{position:static!important}}
.left{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:16px;position:sticky;top:64px}
.left .t{font-size:11px;letter-spacing:.3px;color:var(--tx3);font-weight:600;margin:14px 0 6px}
.left .t:first-child{margin-top:0}
.left>.in,.left>.in.y,.left>select.in.y,.left .row2 .in{width:100%;text-align:left}
.left .r .in.y,.left .r .in.tx{width:118px}.left .r select.in.y{width:118px;text-align:left}.left .r .in.tx{text-align:left}
@media(max-width:640px){.top{padding:0 12px}.top b{margin-right:8px;font-size:14px}.tab{padding:0 10px;white-space:nowrap}.top .sp{width:100%;justify-content:flex-end;padding:0 0 8px}.bar,.split,.page{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
.left .row2{display:flex;gap:6px}.left .row2 .in{flex:1}
.stat{background:var(--pn2);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:14px 0 8px}
.stat .k{font-size:11px;color:var(--tx3)}.stat .v{font-size:24px;font-weight:700;letter-spacing:-.5px}.stat .v small{font-size:12px;color:var(--tx3);font-weight:500;margin-left:2px}
.lt{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.lt .k{color:var(--tx3)}.lt .v{text-align:right;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}

.card.base{border:2px solid var(--ac)}

.nmi:focus{outline:0;border-bottom-color:var(--ac)}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--acbg);color:var(--ac);font-weight:600;white-space:nowrap}
.chip2{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.chip2.up{background:var(--posbg);color:var(--pos)}.chip2.dn{background:var(--negbg);color:var(--neg)}
.warn{margin:0 16px 10px;padding:6px 10px;border-radius:8px;background:var(--wnbg);color:var(--wn);font-size:11.5px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}.card>.kpi:first-of-type{padding-top:40px}
.kl{font-size:11px;color:var(--tx3)}.kv{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2}.kv small{font-size:12px;color:var(--tx3);font-weight:500;margin-left:2px}
.in.sky::placeholder{color:var(--tx2);opacity:1}
.cmpt th{vertical-align:top}.cmpt td small{margin-left:4px;font-size:11px}.cmpt .nmi{width:100%;min-width:120px;font-size:13px}.cmpt th div{text-align:left}
.cdel{position:absolute;top:10px;right:12px;z-index:1;border:1px solid var(--bd2);background:var(--pn);border-radius:8px;font-size:11px;color:var(--tx2);padding:2px 10px}
.cdel:hover:not(:disabled){color:var(--neg);border-color:var(--neg)}.cdel:disabled{opacity:.35;cursor:default}
.cmpt .cn{color:var(--tx3);font-size:11px;margin-right:6px}
.kv.neg,.neg{color:var(--neg)}.pos{color:var(--pos)}
.ks{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.ks span{font-size:11px;background:var(--pn2);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;color:var(--tx2)}
.sx{border-top:1px solid var(--bd)}
.sx>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:11px 16px;cursor:pointer;font-weight:600;font-size:12.5px}
.sx>summary::-webkit-details-marker{display:none}
.sx>summary span::before{content:"›";display:inline-block;width:14px;color:var(--tx3);transition:transform .15s}
.sx[open]>summary span::before{transform:rotate(90deg)}
.sx>summary b{font-weight:500;color:var(--tx2)}
.sx .bd{padding:0 16px 12px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;color:var(--tx2)}
.r>span{flex:1}.r .c{display:flex;align-items:center;gap:4px}
.in{height:28px;border:1px solid transparent;border-radius:8px;padding:0 9px;background:var(--y);color:var(--tx);font:inherit;min-width:0;text-align:right}
.in:hover{border-color:var(--yb)}.in:focus{outline:2px solid var(--ac);outline-offset:-1px}
.in.y{width:112px}.in.sky{background:var(--sk);width:84px}.in.sky:hover{border-color:var(--skb)}
.in.tx{width:140px;text-align:left}
select.in{text-align:left;padding:0 6px}select.in.y{width:132px}
select.in.plain{background:var(--pn2);border-color:var(--bd2)}
em{font-style:normal;color:var(--tx3);font-size:11px;width:14px}
.cp{background:var(--pn2);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0}
.cp .top2{display:flex;gap:6px;align-items:center}.cp .top2 .in{flex:1;width:auto}
.cp .l3{display:grid;grid-template-columns:1.3fr .9fr 1.1fr;gap:6px;margin-top:6px}
.cp .l3 label{display:flex;flex-direction:column;font-size:10.5px;color:var(--tx3);gap:2px}
.cp .l3 .f{display:flex;align-items:center;gap:3px}.cp .l3 .in{width:100%}
.cp .sub{text-align:right;font-size:11px;color:var(--tx3);margin-top:4px}
.ry{background:var(--pn2);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0}
.ry .l2{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:11px;color:var(--tx3)}
.ry .in.y{width:56px}.ry select.in.y{width:118px}.ry .am{margin-left:auto;font-weight:600;color:var(--tx);font-size:12px}
.add{border:1px dashed var(--bd2);background:none;border-radius:8px;padding:4px 10px;color:var(--tx3);width:100%;margin-top:2px}
.add:hover{color:var(--ac);border-color:var(--ac)}
.note{font-size:11px;color:var(--tx3);margin:4px 0 6px}
.res{display:flex;justify-content:space-between;padding:3px 0;color:var(--tx2)}
.res b{font-weight:500;color:var(--tx)}
.res.k{border-top:1px solid var(--bd2);margin-top:4px;padding-top:6px}.res.k b,.res.k{color:var(--tx);font-weight:700}
.res b.neg{color:var(--neg)}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:16px}
.bt{font-weight:700;margin-bottom:8px;font-size:13px}
.bar2{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:3px 0}
.bar2 .tr{height:8px;background:var(--bd);border-radius:4px;position:relative}
.bar2 .tr i{position:absolute;top:0;bottom:0;border-radius:4px}
.bar2 .tr i.p{background:var(--pos);left:50%}.bar2 .tr i.n{background:var(--neg);right:50%}
.bar2 b{text-align:right;font-weight:600}
.pop{margin:12px 20px 0;padding:12px 14px;border:1px solid var(--ac);border-radius:14px;background:var(--acbg)}
.pop textarea{width:100%;height:150px;border:1px solid var(--bd2);border-radius:10px;background:var(--pn);color:var(--tx);font:inherit;padding:8px}
.capt{margin-bottom:12px}.capt b{font-size:18px;font-weight:700}.capt span{color:var(--tx2);margin-left:6px}
.lg{display:flex;gap:16px;padding:12px 20px;font-size:11px;color:var(--tx2);flex-wrap:wrap;border-top:1px solid var(--bd)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;font-weight:400;vertical-align:middle;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{color:var(--tx3);font-size:11px;font-weight:600}
.sc{overflow-x:auto}
.page{padding:16px 20px}
.page .in.y{width:72px}
textarea.in{width:100%;text-align:left;padding:8px;height:86px;resize:vertical}
.f2{display:flex;justify-content:space-between;align-items:center;max-width:420px;padding:4px 0;color:var(--tx2)}
.f2 .in.y{width:112px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/*ENGINE_START*/
// 손익 계산 엔진 (화면과 분리. test_engine.js가 이 구간만 꺼내 엑셀 원본 값과 대조)
var ROY_BASES=['판매가(VAT포함)','매출(VAT제외)','공급가','원가합계','구성품1원가'];
var CH_KEYS=['방송','미리주문','B2C','직매입','공구'];
var CH_NAME={'방송':'홈쇼핑 방송','미리주문':'홈쇼핑 미리주문','B2C':'B2C','직매입':'직매입','공구':'공구'};
var BTYPES=['라이브','데이터'];          // 라이브: 매 회차 고정비 포함 / 데이터: 2회차부터 고정비 제외
var TEMPS=['냉동','냉장','상온'];        // 품온
var SIZES=['소형','중형','대형','선물'];
var ITEMS=['작업료_포장비','아이스박스·박스','선물박스','카톤박스','포장재(레토르트 등)','아이스팩','보냉비닐','드라이아이스','OPP테이프'];
// 팜조아 물류비 기본값 (품온_크기). 현재는 엑셀 원본 블록에서 가져온 임시값 - 실제 단가 받으면 설정 탭에서 교체
var DEF_PACK={
 '상온_소형':{v:[[1000,1],[1000,1],[0,0],[0,0],[0,0],[200,0],[100,0],[1000,0],[50,0]],note:'임시값'},
 '냉동_소형':{v:[[1000,1],[850,1],[0,0],[0,0],[0,0],[100,2],[100,1],[600,1],[50,0]],note:'임시값'},
 '냉동_중형':{v:[[1000,1],[1110,1],[0,0],[0,0],[0,0],[114,2],[100,1],[637,1],[0,0]],note:'임시값'},
 '냉장_중형':{v:[[1000,1],[1109,1],[0,0],[0,0],[0,0],[114,2],[100,1],[637,0],[0,0]],note:'임시값'},
 '냉동_선물':{v:[[0,0],[0,0],[1050,1],[350,1],[150,8],[0,0],[100,0],[600,0],[50,0]],note:'임시값'}
};
var DEF_ST={vat:1.1,conv:0.85,stor:0.012,ship:2400,pack:DEF_PACK};
function num(x){x=parseFloat(x);return isNaN(x)?0:x}
function isNil(v){return v===null||v===undefined||v===''}
function packKey(temp,size){return temp+'_'+size}
function newComp(){return {n:'',p:0,q:1,w:0}}   // 이름, 단가(견적), 수량, 내용량(g, 1개당)
function newSc(){return {name:'',btype:'라이브',chname:'',price:0,commrate:0,target:0,tax:'과세',temp:'냉동',size:'소형',
 comps:[newComp()],ars:0,petc:0,adrate:0,
 roy:[{n:'',b:'',x:1,r:0},{n:'',b:'',x:1,r:0},{n:'',b:'',x:1,r:0}],
 fix:{vcr:0,gma:0,cook:0,mat:0,panel:0,fetc:0},
 shipp:null,shipq:null,iov:{},ston:0,dmfix:0}}
function calcSc(s,ch,ST){
 var o={},bc=ch==='방송',dm=ch==='직매입',k;
 o.conv=bc?ST.conv:1;                                  // 전환율은 방송만 85% 고정
 o.baseqty=bc?num(s.target)*o.conv:(dm?num(s.target):1);
 o.cost=0;o.weight=0;
 s.comps.forEach(function(c){var q=num(c.q);o.cost+=num(c.p)*q;o.weight+=num(c.w)*q});
 o.tax=s.tax||'과세';o.temp=s.temp||'냉동';
 o.price=num(s.price);
 o.sales=o.tax==='과세'?o.price/ST.vat:o.price;
 o.comm=o.sales*num(s.commrate);
 o.supply=o.sales-o.comm;
 o.ad=ch==='B2C'?o.sales*num(s.adrate):0;
 var c1=s.comps.length?num(s.comps[0].p)*num(s.comps[0].q):0;
 o.ra=s.roy.map(function(r){
  var idx=ROY_BASES.indexOf(r.b);if(idx<0)return 0;
  var b=[o.price,o.sales,o.supply,o.cost,c1][idx];
  return b*num(r.x)*num(r.r)});
 o.sga1=num(s.ars)+num(s.petc)+o.ad+o.ra[0]+o.ra[1]+o.ra[2];
 o.fixtot=0;if(bc)for(k in s.fix)o.fixtot+=num(s.fix[k]);
 o.fixset=o.baseqty>0?o.fixtot/o.baseqty:0;
 o.packKey=packKey(o.temp,s.size||'소형');
 var pr=ST.pack&&ST.pack[o.packKey];o.packFound=!!pr;
 o.items=ITEMS.map(function(_,k){var a=pr?pr.v[k]:[0,0],ov=(s.iov&&s.iov[k])||{};
  return {pa:num(a[0]),qa:num(a[1]),p:isNil(ov.p)?num(a[0]):num(ov.p),q:isNil(ov.q)?num(a[1]):num(ov.q)}});
 o.shipp=isNil(s.shipp)?ST.ship:num(s.shipp);
 o.shipqA=bc?0:1;o.shipq=isNil(s.shipq)?o.shipqA:num(s.shipq);
 o.stor=o.sales*ST.stor*(s.ston?1:0);
 o.dmset=dm&&o.baseqty>0?num(s.dmfix)/o.baseqty:0;
 o.logi=o.shipp*o.shipq+o.stor+o.dmset;
 o.items.forEach(function(t){o.logi+=t.p*t.q});
 o.sga=o.sga1+o.fixset+o.logi;
 o.cmpre=o.supply-o.cost-o.sga1-o.logi;                // 고정비 차감 전 CM (엑셀 대조용)
 o.cm=o.supply-o.cost-o.sga;
 o.cmr=o.sales?o.cm/o.sales:0;
 o.rep=bc&&s.btype==='데이터';                          // 데이터(녹화): 2회차부터 방송 고정비 제외
 o.cm2=o.rep?o.cm+o.fixset:o.cm;o.cmr2=o.sales?o.cm2/o.sales:0;
 o.p100=o.weight>0?o.price/o.weight*100:0;
 o.once=bc||dm;
 o.tsales=o.sales*o.baseqty;o.tcm=o.cm*o.baseqty;
 o.bep=bc&&o.cmpre>0?o.fixtot/o.cmpre:0;
 o.bepo=o.conv>0?o.bep/o.conv:0;
 o.rd1=bc?o.tcm:0;
 o.rd2=bc?(s.btype==='데이터'?o.tcm+o.fixtot:o.tcm):0;
 o.cum4=o.rd1+o.rd2*3;
 return o}
var DRV=['공급가(판매가·수수료) 영향','원가 영향','판관비1(로열티 등) 영향','판관비2(방송 고정비) 영향','물류비 영향'];
function deltas(o,b){return {sup:o.supply-b.supply,cost:-(o.cost-b.cost),sga1:-(o.sga1-b.sga1),fix:-(o.fixset-b.fixset),logi:-(o.logi-b.logi),cm:o.cm-b.cm,cmr:o.cmr-b.cmr}}
function driver(d,isBase){
 if(isBase)return '기준안';
 var v=[d.sup,d.cost,d.sga1,d.fix,d.logi],mx=0,ix=0;
 v.forEach(function(x,i){if(Math.abs(x)>mx){mx=Math.abs(x);ix=i}});
 if(mx<0.5)return '차이 없음';
 var r=Math.round(v[ix]);
 return DRV[ix]+' '+(r>0?'+':'')+r.toLocaleString('ko-KR')+'원'+(v[ix]>0?'(이익 증가)':'(이익 감소)')}
// 예시 데이터 (가상 값. 테스트 기준 + 보관함 예시). 구성품: [이름, 단가, 수량, 내용량g]
function C(list){return list.map(function(a){return {n:a[0],p:a[1],q:a[2],w:a[3]}})}
function mk(o){var s=newSc(),k;for(k in o)s[k]=o[k];return s}
function R(n,b,x,r){return {n:n,b:b,x:x,r:r}}
var NOR=R('','',1,0);

function adopt(d){
 var sc=clone(d.sc),b=sc[d.base||0]||sc[0],info;
 if(d.info&&d.info.comps){
  var I=d.info;
  sc.forEach(function(s){
   ['price','commrate','target'].forEach(function(k){if(isNil(s[k]))s[k]=I[k]});
   ['btype','chname','adrate','dmfix'].forEach(function(k){s[k]=I[k]});
   s.comps=I.comps.map(function(c,j){var o=(s.cov&&s.cov[j])||{};return {n:c.n,p:isNil(o.p)?c.p:o.p,q:isNil(o.q)?c.q:o.q,w:c.w}});
   delete s.cov});
  info={tax:I.tax,temp:I.temp}}
 else info=d.info?{tax:d.info.tax,temp:d.info.temp}:{tax:b.tax||'과세',temp:b.temp||'냉동'};
 sc.forEach(function(s){if(!s.comps||!s.comps.length)s.comps=[newComp()];['price','commrate','target'].forEach(function(k){if(isNil(s[k]))s[k]=0})});
 return {info:info,sc:sc}}
function eff(s){var e=Object.assign({},s),I=state.info;e.tax=I.tax;e.temp=I.temp;return e}
function upgrade(s){if(s.ver!==5||!s.info||s.info.comps){var ad=adopt({base:s.base||0,sc:s.sc,info:s.info});s.info=ad.info;s.sc=ad.sc}s.ver=5;return s}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){var r=Math.round(+n||0);return r===0?'0':r.toLocaleString('ko-KR')}
function sgn(n){var r=Math.round(+n||0);return r===0?'0':(r>0?'+':'')+r.toLocaleString('ko-KR')}
function pc(n,d){return ((+n||0)*100).toFixed(d==null?1:d)+'%'}
function disp(v,t){if(isNil(v))return '';if(t==='p')return String(Math.round(v*10000)/100);return (+v).toLocaleString('ko-KR',{maximumFractionDigits:2})}
function setPath(o,p,v){var k=p.split('.'),i;for(i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]]}o[k[k.length-1]]=v}
// 노랑 = 직접 입력 / 하늘색 = 자동값(비우면 자동, 입력하면 덮어씀)
function N(p,v,t,u){t=t||'n';return '<input class="in y" inputmode="decimal" data-p="'+p+'" data-t="'+t+'" value="'+disp(v,t)+'">'+(u?'<em>'+u+'</em>':'')}
function NS(p,v,auto,t){t=t||'n';return '<input class="in sky" inputmode="decimal" data-nul="1" data-p="'+p+'" data-t="'+t+'" value="'+disp(v,t)+'" placeholder="'+disp(auto,t)+'">'}
function TX(p,v,ph,cls){return '<input class="in y tx'+(cls?' '+cls:'')+'" data-p="'+p+'" data-t="s" value="'+esc(v)+'" placeholder="'+esc(ph||'')+'">'}
function SEL(p,v,opts,cls,first,labels){
 var h='<select class="in '+(cls||'y')+'" data-p="'+p+'" data-t="s">';
 if(first!=null)h+='<option value=""'+(v===''?' selected':'')+'>'+esc(first)+'</option>';
 opts.forEach(function(o,i){h+='<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(labels?labels[i]:o)+'</option>'});
 return h+'</select>'}
function RS(l,v,cls,k){return '<div class="res'+(k?' k':'')+'"><span>'+l+'</span><b class="'+(cls||'')+'">'+v+'</b></div>'}
function nm(i){return state.sc[i].name||((i+1)+'안')}
function row(l,h){return '<div class="r"><span>'+l+'</span><div class="c">'+h+'</div></div>'}
function sx(k,t,sum,body,def){var op=ui.open[k];if(op===undefined)op=def;return '<details class="sx" data-k="'+k+'"'+(op?' open':'')+'><summary><span>'+t+'</span><b>'+sum+'</b></summary><div class="bd">'+body+'</div></details>'}

function compute(){
 var os=state.sc.map(function(s){return calcSc(eff(s),state.ch,state.ST)});
 if(state.base>=os.length)state.base=0;
 var b=os[state.base];
 os.forEach(function(o,i){o.d=deltas(o,b);o.drv=driver(o.d,i===state.base)});
 return os}

 var h='<select class="in plain" id="cpick" style="margin-top:6px"><option value="">보관함에서 안 복사해 오기</option>';
 state.saved.forEach(function(x,k){h+='<optgroup label="'+esc(x.name)+'">';(x.data.sc||[]).forEach(function(s,j){h+='<option value="'+k+':'+j+'">'+esc(s.name||((j+1)+'안'))+'</option>'});h+='</optgroup>'});
 return h+'</select>'}
// 보관함의 안 하나를 현재 작업에 새 표(안)로 복사 (값 전체가 그대로 복사됨)
function copyFromSaved(k,j){
 var x=state.saved[k].data,ad=adopt({base:x.base||0,sc:x.sc,info:x.info}),n=clone(ad.sc[j]);
 state.sc.push(n);
 ui.msg='복사했습니다: '+esc(state.saved[k].name)+' › '+esc(n.name||((j+1)+'안'))+(x.ch!==state.ch?' (보관함 항목은 '+esc(CH_NAME[x.ch]||'')+' 채널이라 채널별 항목은 확인 필요)':'')}
function savedOpts(){
 var h='<option value="">저장한 작업 불러오기 ('+state.saved.length+'건)</option>';
 state.saved.forEach(function(x,i){h+='<option value="'+i+'">'+esc(x.name)+' · '+esc(CH_NAME[x.data.ch]||'')+' · '+esc(x.ts)+'</option>'});
 return h}
function infoPanel(){
 var I=state.info;
 return '<div class="t">상품 정보</div>'+row('과세 구분',SEL('info.tax',I.tax,['과세','면세']))+row('품온',SEL('info.temp',I.temp,TEMPS))}
// 안(표)끼리 판매가·구성 가격을 나란히 보는 표. 안 이름 수정·기준안 지정은 여기서, 표 삭제는 각 표 오른쪽 위.
function cmpTable(os){
 var b=os[state.base],bc=state.ch==='방송',dm=state.ch==='직매입',es=state.sc.map(eff),mx=0,
 h='<div class="box cmpt"><div class="bt">구성 가격 비교 <span style="font-weight:400;color:var(--tx3);font-size:11px">안 이름 수정·기준안 지정은 여기서 · 표 삭제는 각 표 오른쪽 위</span></div><div class="sc"><table><thead><tr><th></th>';
 es.forEach(function(e){mx=Math.max(mx,e.comps.length)});
 os.forEach(function(o,i){h+='<th><input class="nmi" data-p="sc.'+i+'.name" data-t="s" placeholder="'+(i+1)+'안 이름" value="'+esc(state.sc[i].name)+'"><div>'+(i===state.base?'<span class="tag">기준안</span>':'<button class="lnk" data-a="base" data-i="'+i+'">기준으로 지정</button>')+'</div></th>'});
 h+='</tr></thead><tbody>';
 function dl(d,i,cost){if(i===state.base)return '';var r=Math.round(d);if(!r)return '';return ' <small class="'+((cost?d>0:d<0)?'neg':'pos')+'">'+sgn(d)+'</small>'}
 function line(label,fn){h+='<tr><td>'+label+'</td>';os.forEach(function(o,i){h+='<td>'+fn(o,i)+'</td>'});h+='</tr>'}
 line('채널 / 방송 형태',function(o,i){return esc(es[i].chname||'-')+(bc?' · '+esc(es[i].btype):'')});
 line('판매가 (VAT 포함)',function(o){return fmt(o.price)+'원'});
 line('수수료율',function(o,i){return pc(es[i].commrate,0)});
 if(bc||dm)line(bc?'목표 수량':'발주 수량',function(o,i){return fmt(es[i].target)+'개'});
 for(var j=0;j<mx;j++)(function(j){line('구성 '+(j+1),function(o,i){var x=es[i].comps[j];return x?'<span class="cn" data-bind="cc'+i+'_'+j+'">'+esc(x.n||('구성품 '+(j+1)))+'</span>'+fmt(x.p)+' x '+fmt(x.q)+' = <b>'+fmt(num(x.p)*num(x.q))+'</b>':'-'})})(j);
 line('<b>원가 합계</b>',function(o,i){return '<b>'+fmt(o.cost)+'</b>원'+dl(o.cost-b.cost,i,true)});
 line('원가율 (원가 / 세트 매출)',function(o){return pc(o.sales?o.cost/o.sales:0,1)});
 line('100g당 판매가',function(o){return o.p100>0?fmt(o.p100)+'원':'-'});
 line('<b>세트당 CM</b>',function(o,i){return '<b>'+fmt(o.cm)+'</b>원'+dl(o.cm-b.cm,i,false)});
 line('CM%',function(o){return pc(o.cmr,1)});
 if(os.some(function(o){return o.rep})){
  line('<b>2회차~ 세트당 CM</b>',function(o,i){return '<b>'+fmt(o.cm2)+'</b>원'+dl(o.cm2-b.cm2,i,false)});
  line('2회차~ CM%',function(o){return pc(o.cmr2,1)})}
 return h+'</tbody></table></div></div>'}
function work(os){
 var b=os[state.base],h,i;
 h=''
  +(ui.kakao?'<div class="pop"><div class="bt">카톡 보고용 요약</div><textarea readonly id="kt">'+esc(ui.kakao)+'</textarea><div style="margin-top:8px;display:flex;gap:8px"><button class="btn" data-a="copy">복사</button><button class="btn" data-a="kclose">닫기</button></div></div>':'')
  +(ui.msg?'<div class="pop">'+ui.msg+'</div>':'');
 h+='<div class="split"><div class="left">'
  +'<div class="t">상품명</div><input class="in y" data-p="title" data-t="s" value="'+esc(state.title)+'" placeholder="예: 김 세트">'
  +'<div class="t">채널</div>'+SEL('ch',state.ch,CH_KEYS,'y',null,CH_KEYS.map(function(c){return CH_NAME[c]}))
  +'<div class="t">보관함</div><div class="note">작업을 저장해 두고 다시 열 때 씁니다. 안끼리 비교는 오른쪽 카드와 표에서 합니다.</div><select class="in plain" id="ld">'+savedOpts()+'</select>'+copyOpts()
  +'<div class="row2" style="margin-top:6px"><input class="in tx" id="sn" placeholder="저장 이름"><button class="btn sm" data-a="save">저장</button></div>'
  +'<div class="stat"><div class="k">기준안 100g당 판매가</div><div class="v">'+(b.p100>0?fmt(b.p100):'-')+'<small>원</small></div></div>'
  +infoPanel()+'<div class="t">메모 (IP·로열티 계약, 최근 실적)</div><textarea class="in" data-p="memo" data-t="s">'+esc(state.memo)+'</textarea>'
  +'</div>'
  +'<div class="right"><div id="capw"><div class="capt"><b data-bind="title">'+esc(state.title)+'</b><span>'+CH_NAME[state.ch]+' / '+today()+' / '+(b.once?'1회 기준':'1개 기준')+'</span></div><div class="grid">';
 for(i=0;i<os.length;i++)h+=card(i,os[i]);
 h+='</div>'+cmpTable(os);
 os.forEach(function(o,i){
  if(i===state.base)return;
  var d=o.d,rows=[['공급가 (판매가·수수료)',d.sup],['원가',d.cost],['판관비 1 (로열티 등)',d.sga1],['판관비 2 (방송 고정비)',d.fix],['물류비',d.logi]],r='',mx=1;
  rows.forEach(function(x){mx=Math.max(mx,Math.abs(x[1]))});
  rows.forEach(function(x){if(Math.abs(x[1])>=0.5)r+='<div class="bar2"><span>'+x[0]+'</span><div class="tr"><i class="'+(x[1]>0?'p':'n')+'" style="width:'+(Math.abs(x[1])/mx*50)+'%"></i></div><b class="'+(x[1]>0?'pos':'neg')+'">'+sgn(x[1])+'원</b></div>'});
  h+='<div class="box"><div class="bt"><span data-bind="nm'+i+'">'+esc(nm(i))+'</span> vs 기준 <span data-bind="nm'+state.base+'">'+esc(nm(state.base))+'</span>: 세트당 '+sgn(d.cm)+'원 (CM% '+(d.cmr>=0?'+':'')+(d.cmr*100).toFixed(2)+'%p)</div>'+(r||'<div style="color:var(--tx2)">차이 없음</div>')+'</div>'});
 return h+'</div></div></div>'}

// ---------- 보관함 탭 (관리) ----------
function boxTab(){
 var h='<div class="page"><div class="bt">보관함 관리</div>'+(ui.msg?'<div class="pop" style="margin:0 0 10px">'+ui.msg+'</div>':'')
  +'<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap"><button class="btn" data-a="export">전체 내보내기 (JSON)</button><button class="btn" data-a="import">가져오기 (JSON)</button><input type="file" id="imp" accept=".json" style="display:none"><button class="btn" data-a="blank">새로 시작 (빈 작업대)</button></div>'
  +'<div class="note">불러오기는 작업대 왼쪽 "보관함" 드롭다운에서 합니다. 저장은 이 브라우저에만 되므로 다른 PC로 옮길 때는 JSON 내보내기를 쓰세요.</div>'
  +'<div class="sc"><table><thead><tr><th>이름</th><th>채널</th><th>안 수</th><th>저장일</th><th></th></tr></thead><tbody>';
 state.saved.forEach(function(x,i){h+='<tr><td>'+esc(x.name)+'</td><td>'+esc(CH_NAME[x.data.ch]||'')+'</td><td>'+x.data.sc.length+'</td><td>'+esc(x.ts)+'</td><td><button class="mini" data-a="load" data-i="'+i+'">불러오기</button> <button class="mini" data-a="delsaved" data-i="'+i+'">삭제</button></td></tr>'});
 if(!state.saved.length)h+='<tr><td colspan="5" style="color:var(--tx3)">저장한 항목이 없습니다.</td></tr>';
 return h+'</tbody></table></div></div>'}

// ---------- 설정 탭 (고정값 + 팜조아 물류비) ----------
function setTab(){
 var ST=state.ST,h='<div class="page">'+(ui.msg?'<div class="pop" style="margin:0 0 10px">'+ui.msg+'</div>':'')+'<div class="bt">고정값</div>'
  +'<div class="f2"><span>VAT 나눔값 (과세)</span>'+N('ST.vat',ST.vat)+'</div>'
  +'<div class="f2"><span>방송 전환율 (고정)</span><b>'+pc(ST.conv,0)+'</b></div>'
  +'<div class="f2"><span>보관료율 (세트 매출 대비)</span><span>'+N('ST.stor',ST.stor,'p','%')+'</span></div>'
  +'<div class="f2"><span>택배비 기본 단가 (팜조아)</span><span>'+N('ST.ship',ST.ship,'n','원')+'</span></div>'
  +'<div class="bt" style="margin-top:16px">팜조아 물류비 기본값 (품온_크기) <span class="tag" style="background:var(--wnbg);color:var(--wn)">임시값 - 실제 단가 받으면 교체</span></div>'
  +'<div class="note">카드의 품온·포장 크기에 맞는 줄이 자동으로 들어갑니다. 카드에서 항목별로 덮어쓸 수 있습니다. 칸마다 위는 단가, 아래는 수량입니다.</div>'
  +'<div class="sc"><table><thead><tr><th>품온_크기</th>';
 ITEMS.forEach(function(it){h+='<th>'+it+'</th>'});
 h+='<th>비고</th></tr></thead><tbody>';
 TEMPS.forEach(function(t){SIZES.forEach(function(z){var key=packKey(t,z),p=ST.pack[key],P='ST.pack.'+key+'.';
  h+='<tr><td><b>'+key+'</b></td>';
  if(p){p.v.forEach(function(v,k){h+='<td>'+N(P+'v.'+k+'.0',v[0])+'<br>'+N(P+'v.'+k+'.1',v[1])+'</td>'});
   h+='<td style="white-space:normal;min-width:180px">'+TX(P+'note',p.note,'출처·비고')+' <button class="mini" data-a="delpack" data-k="'+key+'">비우기</button></td>'}
  else h+='<td colspan="'+ITEMS.length+'" style="text-align:left;color:var(--tx3)">값 없음 (0원 처리)</td><td><button class="mini" data-a="addpack" data-k="'+key+'">값 입력</button></td>';
  h+='</tr>'})});
 h+='</tbody></table></div><div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-a="test">예시 값 대조 검증 실행</button><button class="btn" data-a="resetst">설정을 초기값으로 복원</button></div></div>';
 return h}

// ---------- 렌더 ----------
function render(keep){
 var a=document.activeElement,k=null;
 if(keep&&a&&a.dataset&&a.dataset.p)k={p:a.dataset.p,v:a.value,s:a.selectionStart};
 var os=compute();
 var tabs=[['work','작업대'],['box','보관함'],['set','설정']];
 var h='<div class="top"><b>손익 시뮬레이터</b>'+tabs.map(function(t){return '<button class="tab'+(ui.tab===t[0]?' on':'')+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+(ui.tab==='work'?'<span class="sp"><button class="btn sm" data-a="addsc">+ 안 추가</button><button class="btn sm" data-a="cap" data-id="capw" data-n="손익비교">캡처</button><button class="btn sm pri" data-a="kakao">카톡 요약</button></span>':'')+'</div>';
 h+=ui.tab==='work'?work(os):ui.tab==='box'?boxTab():setTab();
 h+='<div class="lg"><span><i style="background:var(--y);border:1px solid var(--yb)"></i>직접 입력</span><span><i style="background:var(--sk);border:1px solid var(--skb)"></i>자동값 (비우면 자동, 입력하면 덮어씀)</span><span>글자만 있는 값은 자동 계산 결과</span><span style="margin-left:auto">v0.12 · 자동 저장 (이 브라우저)</span></div>';
 document.getElementById('app').innerHTML=h;
 if(k){var e=document.querySelector('[data-p="'+k.p+'"]');if(e){e.focus();if(e.tagName!=='SELECT'&&e.type!=='checkbox'){e.value=k.v;try{e.setSelectionRange(k.s,k.s)}catch(x){}}}}
 persist()}
// 글자 입력칸은 화면을 다시 그리지 않고 이름 표시만 갱신 (한글 조합이 끊기지 않게)
function updateBinds(){
 document.querySelectorAll('[data-bind]').forEach(function(el){var b=el.dataset.bind;
  if(b==='title')el.textContent=state.title;
  else if(b.indexOf('nm')===0){var i=+b.slice(2);if(state.sc[i])el.textContent=nm(i)}
  else if(b.indexOf('cc')===0){var m=b.slice(2).split('_'),xx=state.sc[+m[0]],cc=xx&&xx.comps[+m[1]];if(cc)el.textContent=cc.n||('구성품 '+(+m[1]+1))}})}

function readVal(el){
 var t=el.dataset.t,v=el.value;
 if(t==='c')return el.checked?1:0;
 if(t==='n'||t==='p'){var raw=v.replace(/[,\s%]/g,'');
  if(raw==='')return el.dataset.nul?null:0;
  var val=parseFloat(raw);if(isNaN(val))return el.dataset.nul?null:0;
  return t==='p'?val/100:val}
 return v}
function isTextField(el){return el.dataset.t==='s'&&el.tagName!=='SELECT'}
var composing=false;
function onInput(e){
 var el=e.target,p=el.dataset&&el.dataset.p;if(!p)return;
 if(el.tagName==='SELECT'||el.type==='checkbox')return;        // change 이벤트에서 처리
 if(isTextField(el)){setPath(state,p,el.value);updateBinds();persist();return}
 if(e.isComposing||composing)return;                           // 숫자칸에서 한글 조합 중이면 대기
 setPath(state,p,readVal(el));render(true)}
var app=document.getElementById('app');
app.addEventListener('compositionstart',function(){composing=true});
app.addEventListener('compositionend',function(e){composing=false;var el=e.target;
 if(el.dataset&&el.dataset.p){setPath(state,el.dataset.p,readVal(el));if(isTextField(el)){updateBinds();persist()}else render(true)}});
app.addEventListener('input',onInput);
app.addEventListener('change',function(e){var el=e.target;
 if(el.id==='imp'){doImport(el);return}
 if(el.id==='cpick'){if(el.value){var pp=el.value.split(':');copyFromSaved(+pp[0],+pp[1])}render();return}
 if(el.id==='ld'){if(el.value!==''){var x=state.saved[+el.value];applySnap(x.data);ui.msg='불러왔습니다: '+esc(x.name)}render();return}
 if(el.dataset&&el.dataset.p&&(el.tagName==='SELECT'||el.type==='checkbox')){setPath(state,el.dataset.p,readVal(el));render()}});

function capture(id,name){
 var el=document.getElementById(id);
 if(!window.html2canvas){ui.msg='캡처 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';render();return}
 html2canvas(el,{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2}).then(function(cv){
  cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'_'+today()+'.png';a.click();
   try{navigator.clipboard.write([new ClipboardItem({'image/png':b})])}catch(x){}
   ui.msg='이미지로 저장했습니다: '+esc(a.download);render()})}).catch(function(err){ui.msg='캡처 실패: '+esc(err&&err.message||err);render()})}

function snapshot(){return clone({ch:state.ch,title:state.title,memo:state.memo,base:state.base,info:state.info,sc:state.sc})}
function applySnap(d){state.ch=d.ch;state.title=d.title;state.memo=d.memo||'';state.base=d.base||0;var ad=adopt({base:state.base,sc:d.sc,info:d.info});state.info=ad.info;state.sc=ad.sc;ui.tab='work';ui.kakao='';ui.msg=''}

app.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;
 var a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
 ui.msg='';
 if(a==='tab'){ui.tab=b.dataset.t;ui.kakao=''}
 else if(a==='addsc'){var cb=clone(state.sc[state.base]);cb.name='';state.sc.push(cb)}
 else if(a==='del'){if(state.sc.length>1){state.sc.splice(i,1);if(state.base===i)state.base=0;else if(state.base>i)state.base--}}
 else if(a==='base'){state.base=i}
 else if(a==='addcomp'){state.sc[i].comps.push(newComp())}
 else if(a==='delcomp'){if(state.sc[i].comps.length>1)state.sc[i].comps.splice(j,1)}
 else if(a==='kakao'){ui.kakao=kakaoText(compute())}
 else if(a==='kclose'){ui.kakao=''}
 else if(a==='copy'){var t=document.getElementById('kt');t.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}ui.msg=ok?'복사했습니다.':'복사하지 못했습니다. 글자를 직접 선택해 복사해 주세요.'}
 else if(a==='cap'){capture(b.dataset.id,b.dataset.n);return}
 else if(a==='save'){var nmv=document.getElementById('sn').value.trim();if(!nmv){ui.msg='저장 이름을 입력해 주세요.'}else{state.saved.unshift({name:nmv,ts:today(),data:snapshot()});ui.msg='저장했습니다: '+esc(nmv)}}
 else if(a==='load'){applySnap(state.saved[i].data);ui.msg='불러왔습니다: '+esc(state.saved[i].name)}
 else if(a==='delsaved'){state.saved.splice(i,1)}
 else if(a==='export'){var bl=new Blob([JSON.stringify(state)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='손익시뮬레이터_백업_'+today()+'.json';l.click();ui.msg='내보냈습니다.'}
 else if(a==='import'){document.getElementById('imp').click();return}
 else if(a==='blank'){state.sc=[newSc()];state.info=newInfo();state.base=0;state.ch='방송';state.title='';state.memo='';ui.tab='work'}
 else if(a==='addpack'){state.ST.pack[b.dataset.k]={v:ITEMS.map(function(){return [0,0]}),note:''}}
 else if(a==='delpack'){delete state.ST.pack[b.dataset.k]}
 else if(a==='resetst'){state.ST=clone(DEF_ST);ui.msg='설정과 팜조아 기본값을 초기값으로 되돌렸습니다.'}
 else if(a==='test'){var r=selfTest();ui.msg='예시 값 대조 (초기 설정 기준, 고정비 차감 전 CM)<br>'+r.map(function(x){return (x.ok?'일치 ':'불일치 ')+esc(x.name)+': 기대 '+x.exp+' / 계산 '+x.got.toFixed(2)}).join('<br>')}
 render()});
function doImport(inp){
